esphome:
  name: m5-env3

esp32:
  board: m5stick-c
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: 192.168.100.141      # your Mosquitto host
  # username: !secret mqtt_user
  # password: !secret mqtt_password

# The Plus2 powers itself off on battery unless GPIO4 is held high
switch:
  - platform: gpio
    pin: GPIO4
    id: power_hold
    restore_mode: ALWAYS_ON
    internal: true

i2c:
  sda: GPIO32
  scl: GPIO33
  scan: true

sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      name: "Indoor Temperature"
    humidity:
      name: "Indoor Humidity"
    update_interval: 60s

  - platform: qmp6988
    address: 0x70
    temperature:
      name: "QMP Temperature"
      internal: true
    pressure:
      name: "Indoor Pressure"
    update_interval: 60s