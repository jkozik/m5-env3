esphome:
  name: m5-env3

esp32:
  board: m5stick-c
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

text_sensor:
  - platform: version
    name: "ESPHome Version"

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: 192.168.100.174
  port: 1883
  discovery: false

web_server:
  port: 80
  version: 3

# The Plus2 powers itself off on battery unless GPIO4 is held high
switch:
  - platform: gpio
    pin: GPIO4
    id: power_hold
    restore_mode: ALWAYS_ON
    internal: true

i2c:
  sda: GPIO32
  scl: GPIO33
  scan: true
  frequency: 100kHz

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO15

output:
  - platform: ledc
    pin: GPIO27
    inverted: false
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    id: display_backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_main
    size: 18

image:
  - file: "mdi:wifi"
    id: wifi_icon
    type: BINARY
    resize: 20x20

display:
  - platform: mipi_spi
    model: st7789v
    cs_pin: GPIO5
    dc_pin: GPIO14
    reset_pin: GPIO12
    rotation: 90
    dimensions:
      height: 240
      width: 135
      offset_height: 40
      offset_width: 52
    invert_colors: true
    update_interval: 1s
    lambda: |-
      // Heartbeat: flips every redraw (not derived from millis(), which
      // aliases against a 1s update_interval and never visibly changes)
      static bool heartbeat_on = false;
      heartbeat_on = !heartbeat_on;
      if (heartbeat_on) {
        it.filled_circle(125, 8, 4, Color(0, 255, 0));
      }

      // WiFi status icon: green = connected, red = not connected, top-left
      if (id(wifi_comp).is_connected()) {
        it.image(2, 2, id(wifi_icon), Color(0, 255, 0));
      } else {
        it.image(2, 2, id(wifi_icon), Color(255, 0, 0));
      }

      // Sensor readout
      it.printf(10, 30, id(font_main), Color(255, 255, 255), "%.1f C", id(indoor_temp).state);
      it.printf(10, 60, id(font_main), Color(255, 255, 255), "%.0f %%RH", id(indoor_hum).state);
      it.printf(10, 90, id(font_main), Color(255, 255, 255), "%.0f hPa", id(indoor_pressure).state);

sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      name: "Indoor Temperature"
      id: indoor_temp
    humidity:
      name: "Indoor Humidity"
      id: indoor_hum
    update_interval: 30s

  - platform: qmp6988
    address: 0x70
    temperature:
      name: "QMP Temperature"
      internal: true
    pressure:
      name: "Indoor Pressure"
      id: indoor_pressure
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s

  - platform: debug
    free:
      name: "Heap Free"

debug:

interval:
  - interval: 30s
    then:
      - mqtt.publish_json:
          topic: weewxrtlsdr/indoor/state
          payload: |-
            root["temperature_C"] = id(indoor_temp).state;
            root["humidity_pct"] = id(indoor_hum).state;
            root["pressure_hPa"] = id(indoor_pressure).state;